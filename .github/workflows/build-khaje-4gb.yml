name: "Build Khaje 4GB - KSU Next (sem builder)"

# Workflow próprio baseado no antigo, mas sem depender de branch builder
# ou de kernelSourceURL/kernelBranch. Builda direto do checkout atual
# usando clang + make, integra KSU Next oficial + SUSFS e mantém tuning 4GB.

on:
  workflow_dispatch:
    inputs:
      kernelDevice:
        description: "Device (defconfig base)"
        required: true
        type: choice
        default: "unified"
        options:
          - "unified"
          - "gki"
          - "khaje-stock"
      ksuNextBranch:
        description: "Branch/tag do KSU Next (next, stable, dev)"
        required: true
        type: string
        default: "next"
      localVersion:
        description: "Custom localversion (ex: -khaje-ksu-next)"
        required: false
        type: string
        default: "-khaje-ksu-next"
      buildKSU:
        description: "Build KSU variant?"
        required: true
        type: choice
        default: "both"
        options:
          - "noksu"
          - "ksu"
          - "both"

env:
  OUT_DIR: out
  CLANG_DIR: clang-toolchains

jobs:
  Build-Kernel:
    name: "🚀 Build ${{ matrix.variant }} (${{ inputs.kernelDevice }})"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(
          inputs.buildKSU == 'both' && '["noksu", "ksu"]' ||
          inputs.buildKSU == 'ksu' && '["ksu"]' ||
          '["noksu"]' ) }}
    steps:
      - name: "📥 Checkout (sem depender de branch builder)"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🧹 Limpeza"
        run: |
          rm -rf ${{ env.OUT_DIR }} KernelSU KernelSU-Next drivers/kernelsu susfs4ksu
          mkdir -p ${{ env.OUT_DIR }}
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          echo "DEFCONFIG_NAME=${{ inputs.kernelDevice }}_defconfig" >> $GITHUB_ENV

      - name: "📐 Setup SWAP 12GB"
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 12

      - name: "📦 Deps"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev libncurses-dev \
            python3 pahole dwarves cpio rsync git wget curl \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi lld llvm
          sudo apt-get install -y --no-install-recommends liburing-dev || true

      - name: "🔧 Setup Clang r547379 (sem builder)"
        run: |
          set -e
          mkdir -p ${{ env.CLANG_DIR }}
          URL="https://github.com/topnotchfreaks/clang/releases/download/v1.0.0/clang-r547379.tar.gz"
          DEST="${{ env.CLANG_DIR }}/clang-r547379.tar.gz"
          EXTRACT="${{ env.CLANG_DIR }}/clang-r547379"
          mkdir -p "$EXTRACT"
          wget -q --show-progress -O "$DEST" "$URL"
          tar -xzf "$DEST" -C "$EXTRACT" --strip-components=1
          echo "CLANG_BIN_DIR=$EXTRACT/bin" >> $GITHUB_ENV
          echo "$EXTRACT/bin" >> $GITHUB_PATH
          echo "PATH=$EXTRACT/bin:$PATH" >> $GITHUB_ENV
          $EXTRACT/bin/clang --version
          ls -lh $EXTRACT/bin | head -n 20

      - name: "⚙️ Configure kernel (tuning 4GB)"
        run: |
          set -e
          CONFIG_FILE="arch/arm64/configs/${DEFCONFIG_NAME}"
          FRAGMENT="arch/arm64/configs/khaje_4gb_tuning.fragment"

          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ $CONFIG_FILE não existe"
            ls arch/arm64/configs/ | grep -E "unified|gki|khaje"
            exit 1
          fi

          if [ -n "${{ inputs.localVersion }}" ]; then
            sed -i '/^CONFIG_LOCALVERSION=/d' "$CONFIG_FILE"
            echo "CONFIG_LOCALVERSION=\"${{ inputs.localVersion }}\"" >> "$CONFIG_FILE"
          fi

          for opt in CONFIG_KALLSYMS=y CONFIG_TMPFS_XATTR=y CONFIG_TMPFS_POSIX_ACL=y; do
            key=$(echo $opt | cut -d= -f1)
            grep -q "^${key}=" "$CONFIG_FILE" || echo "$opt" >> "$CONFIG_FILE"
          done

          if [ -f "$FRAGMENT" ]; then
            if ! grep -q "CONFIG_LRU_GEN_ENABLED=y" "$CONFIG_FILE"; then
              echo "Aplicando fragmento $FRAGMENT"
              cat "$FRAGMENT" >> "$CONFIG_FILE"
            else
              echo "Tuning já presente"
            fi
          fi

          echo "--- verificacao tuning ---"
          for opt in "CONFIG_LRU_GEN_ENABLED=y" "CONFIG_ZRAM_DEF_COMP_LZ4KD=y" "# CONFIG_KASAN is not set"; do
            grep -qF "$opt" "$CONFIG_FILE" && echo "ok: $opt" || echo "AVISO: ausente -> $opt"
          done
          tail -n 50 "$CONFIG_FILE"

      - name: "🔧 Setup KSU Next with SUSFS"
        if: matrix.variant == 'ksu'
        run: |
          set -e
          rm -rf KernelSU KernelSU-Next drivers/kernelsu susfs4ksu
          KSU_BRANCH="${{ inputs.ksuNextBranch }}"
          echo "📦 KSU Next branch: $KSU_BRANCH"

          if curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${KSU_BRANCH}/kernel/setup.sh" -o /tmp/ksu-setup.sh; then
            bash /tmp/ksu-setup.sh "$KSU_BRANCH" || bash /tmp/ksu-setup.sh next || true
          else
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" -o /tmp/ksu-setup.sh
            bash /tmp/ksu-setup.sh next || true
          fi

          if [ ! -d "KernelSU" ] && [ ! -d "KernelSU-Next" ]; then
            echo "Fallback clone manual"
            git clone --depth=1 --branch "$KSU_BRANCH" https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next || \
            git clone --depth=1 --branch next https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU-Next
          fi

          if [ -d "KernelSU-Next" ]; then
            rm -rf drivers/kernelsu
            ln -sf ../KernelSU-Next/kernel drivers/kernelsu
          elif [ -d "KernelSU" ]; then
            rm -rf drivers/kernelsu
            if [ -d "KernelSU/kernel" ]; then
              ln -sf ../KernelSU/kernel drivers/kernelsu
            else
              ln -sf ../KernelSU drivers/kernelsu
            fi
          fi

          grep -q 'obj-$(CONFIG_KSU) += kernelsu/' drivers/Makefile || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile
          grep -q 'source "drivers/kernelsu/Kconfig"' drivers/Kconfig || sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' drivers/Kconfig

          echo "📦 SUSFS4KSU gki-android13-5.15"
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b gki-android13-5.15

          PATCH="susfs4ksu/kernel_patches/50_add_susfs_in_gki-android13-5.15.patch"
          if [ -f "$PATCH" ]; then
            patch -p1 < "$PATCH" && echo "✅ patch aplicado" || echo "⚠️ patch falhou, copiando manual"
          fi

          mkdir -p fs include/linux
          cp -f susfs4ksu/kernel_patches/fs/susfs.c fs/susfs.c 2>/dev/null || true
          cp -f susfs4ksu/kernel_patches/include/linux/susfs.h include/linux/susfs.h 2>/dev/null || true
          [ -f susfs4ksu/kernel_patches/include/linux/susfs_def.h ] && cp -f susfs4ksu/kernel_patches/include/linux/susfs_def.h include/linux/susfs_def.h || true
          find susfs4ksu -name "susfs.c" -exec cp -f {} fs/susfs.c \; 2>/dev/null || true

          rm -rf susfs4ksu

          CONFIG_FILE="arch/arm64/configs/${DEFCONFIG_NAME}"
          sed -i '/^CONFIG_KSU=/d' "$CONFIG_FILE"
          sed -i '/^CONFIG_KSU_SUSFS/d' "$CONFIG_FILE"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU=y
          CONFIG_KPROBES=y
          CONFIG_HAVE_KPROBES=y
          CONFIG_KPROBE_EVENTS=y
          CONFIG_OVERLAY_FS=y
          CONFIG_KSU_SUSFS=y
          CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_PATH=y
          CONFIG_KSU_SUSFS_SUS_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SUS_KSTAT=y
          CONFIG_KSU_SUSFS_TRY_UMOUNT=y
          CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT=y
          CONFIG_KSU_SUSFS_SPOOF_UNAME=y
          CONFIG_KSU_SUSFS_ENABLE_LOG=y
          CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=y
          CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=y
          CONFIG_KSU_SUSFS_OPEN_REDIRECT=y
          CONFIG_KSU_SUSFS_SUS_SU=y
          EOF

      - name: "🧩 Patch KABI sysvipc"
        continue-on-error: true
        run: |
          curl -sL "https://raw.githubusercontent.com/ravindu644/Droidspaces-OSS/main/Documentation/resources/kernel-patches/GKI/below-kernel-6.12/001.GKI-below-6.12-fix_sysvipc_kabi_6_7_8.patch" | git apply -v || echo "KABI patch falhou ou já aplicado"

      - name: "🔨 Build kernel (sem builder, make direto)"
        run: |
          set -e
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH="${{ env.CLANG_BIN_DIR }}:$PATH"
          clang --version
          ld.lld --version || true

          rm -rf ${{ env.OUT_DIR }}
          mkdir -p ${{ env.OUT_DIR }}

          MAKE_ARGS="ARCH=arm64 O=${{ env.OUT_DIR }} LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi- CLANG_TRIPLE=aarch64-linux-gnu-"

          echo "make $MAKE_ARGS ${DEFCONFIG_NAME}"
          make $MAKE_ARGS ${DEFCONFIG_NAME}

          if [ "${{ matrix.variant }}" = "noksu" ]; then
            ./scripts/config --file ${{ env.OUT_DIR }}/.config -d CONFIG_KSU -d CONFIG_KSU_SUSFS || true
            sed -i '/CONFIG_KSU/d' ${{ env.OUT_DIR }}/.config || true
            make $MAKE_ARGS olddefconfig
          fi

          grep -E "KSU|SUSFS|LRU_GEN|ZRAM" ${{ env.OUT_DIR }}/.config | head -n 100 || true

          make $MAKE_ARGS -j$(nproc --all) 2>&1 | tee build.log

          ls -lh ${{ env.OUT_DIR }}/arch/arm64/boot/
          cp ${{ env.OUT_DIR }}/arch/arm64/boot/Image Image.${{ matrix.variant }}
          cp ${{ env.OUT_DIR }}/arch/arm64/boot/Image.gz Image.gz.${{ matrix.variant }} 2>/dev/null || true
          cp ${{ env.OUT_DIR }}/arch/arm64/boot/Image.lz4 Image.lz4.${{ matrix.variant }} 2>/dev/null || true

      - name: "📦 Prepare artifact"
        run: |
          ls -lh Image.* || true

      - name: "📤 Upload kernel"
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.variant }}-${{ inputs.kernelDevice }}
          path: |
            Image.${{ matrix.variant }}
            Image.gz.${{ matrix.variant }}
            Image.lz4.${{ matrix.variant }}
          if-no-files-found: warn
          retention-days: 3

  Package-Kernels:
    name: "📦 Package kernels"
    runs-on: ubuntu-latest
    needs: Build-Kernel
    steps:
      - name: "📥 Download artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./kernels/

      - name: "📥 Checkout para tuning module"
        uses: actions/checkout@v4
        with:
          path: ksrc
          fetch-depth: 1

      - name: "🐚 Tuning module (shell, sem compilar)"
        run: |
          if [ -f "ksrc/tuning/build-module.sh" ]; then
            ( cd ksrc && sh tuning/build-module.sh )
            cp ksrc/tuning/dist/*.zip "$GITHUB_WORKSPACE/khaje-tuning.zip" || true
          else
            echo "tuning não encontrado"
          fi

      - name: "📦 Create flashable ZIP"
        run: |
          BUILD_TIME=$(date +'%Y-%m-%d')
          git clone --depth=1 https://github.com/topnotchfreaks/AnyKernel3 -b master AnyKernel3
          find kernels -name "Image.*" -exec cp {} AnyKernel3/ \;
          ls -lh AnyKernel3/Image* || true
          ZIP_NAME="Anykernel3_KSU-Next_khaje4gb_${{ inputs.kernelDevice }}_${BUILD_TIME}.zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..
          echo "ZIP_PATH=$(pwd)/$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: "📤 Upload final package"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 7

      - name: "📤 Upload tuning module"
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: khaje-4gb-tuning-module
          path: khaje-tuning.zip
          retention-days: 7
          if-no-files-found: warn
